# YuiMorph 语言文件（MiniMessage 格式：https://docs.advntr.dev/minimessage/format.html）
# 缺失的键会自动使用插件内置的默认文本

prefix: "<#dddddd>≡ <#ff9ecf>YuiMorph</#ff9ecf> » </#dddddd>"

morph:
  success: "<white>你伪装成了 <#ff9ecf><disguise></#ff9ecf></white>"
  unmorph: "<white>你解除了伪装</white>"
  not-disguised: "<gray>你当前没有伪装</gray>"
  already: "<gray>你已经是 <disguise> 了</gray>"
  invalid-id: "<red>无效的伪装：<id></red>"
  not-unlocked: "<red>你还没有解锁 <disguise></red>"
  no-permission: "<red>你没有权限伪装成 <disguise></red>"
  banned: "<red><disguise> 已被服务器禁用</red>"
  world-disabled: "<red>当前世界不允许伪装</red>"
  banned-removed: "<gray><disguise> 已被服务器禁用，已为你解除伪装</gray>"
  world-disabled-removed: "<gray>当前世界不允许伪装，已为你解除伪装</gray>"
  fetching-skin: "<gray>正在获取 <name> 的皮肤…</gray>"
  skin-failed: "<yellow>没有获取到 <name> 的皮肤，将使用默认皮肤</yellow>"
  players-only: "<red>只有玩家才能使用这个命令</red>"

property:
  not-disguised: "<gray>你需要先伪装才能设置属性</gray>"
  none: "<gray><disguise> 没有可以设置的属性</gray>"
  header: "<white><disguise> 的属性（/morphprop 属性 值，只写属性名则重置）：</white>"
  entry: "<#ff9ecf><key></#ff9ecf> <dark_gray>=</dark_gray> <white><value></white> <dark_gray>[<values>]</dark_gray>"
  # 下面两条会嵌入其他消息，请只写纯文本
  default: "默认"
  free-text: "任意文本"
  set: "<white>已将 <#ff9ecf><key></#ff9ecf> 设为 <value></white>"
  reset: "<white>已重置 <#ff9ecf><key></#ff9ecf></white>"
  unknown-key: "<red>当前伪装没有属性 <key></red>"
  invalid-value: "<red><key> 不能设为 <value></red>"
  no-permission: "<red>你没有权限设置 <key></red>"

unlock:
  new: "<white>解锁了新伪装：<#ff9ecf><disguise></#ff9ecf></white>"

gui:
  title: "选择伪装"
  prev: "<white>上一页 <gray>(<page>/<pages>)</gray></white>"
  next: "<white>下一页 <gray>(<page>/<pages>)</gray></white>"
  unmorph: "<red>解除伪装</red> <gray>(当前：<disguise>)</gray>"
  not-disguised: "<gray>当前没有伪装</gray>"
  empty: "<gray>你还没有解锁任何伪装，去击杀生物试试吧</gray>"
  entry-id: "<dark_gray><id></dark_gray>"
  entry-current: "<#ff9ecf>✔ 当前伪装</#ff9ecf>"

request:
  self: "<red>不能和自己交换伪装</red>"
  already-exchanged: "<gray>你和 <player> 已经交换过伪装了</gray>"
  pending: "<gray>你已经向 <player> 发送过请求，请等待对方回应</gray>"
  sent: "<white>已向 <player> 发送交换请求，<seconds> 秒内有效</white>"
  received: "<white><#ff9ecf><player></#ff9ecf> 想和你交换伪装（<seconds> 秒内有效）</white>"
  accept-button: "<green><bold>[接受]</bold></green>"
  deny-button: "<red><bold>[拒绝]</bold></red>"
  accepted: "<white>你接受了 <player> 的交换请求</white>"
  accepted-by: "<white><player> 接受了你的交换请求</white>"
  denied: "<white>你拒绝了 <player> 的交换请求</white>"
  denied-by: "<gray><player> 拒绝了你的交换请求</gray>"
  not-found: "<red>没有来自 <player> 的有效请求</red>"
  offline: "<red><player> 已经离线</red>"

admin:
  reloaded: "<white>配置已重载</white>"
  granted: "<white>已给予 <player> 伪装 <disguise></white>"
  already-granted: "<gray><player> 已经拥有 <disguise></gray>"
  revoked: "<white>已移除 <player> 的伪装 <disguise></white>"
  not-granted: "<gray><player> 没有 <disguise></gray>"
  forced: "<white>已让 <player> 伪装成 <disguise></white>"
  force-unmorphed: "<white>已解除 <player> 的伪装</white>"
  no-target: "<red>没有找到目标玩家</red>"
  status: "<white>YuiMorph <version>：<disguised> 人正在伪装，<banned> 条封禁规则</white>"
  query: "<white><player> 正在伪装成 <#ff9ecf><disguise></#ff9ecf> <dark_gray>(<id>)</dark_gray>，属性：<properties></white>"
  query-none: "<gray><player> 当前没有伪装</gray>"
  queryall-header: "<white>正在伪装的玩家（<count>）：</white>"
  queryall-entry: "<white><player></white> <dark_gray>→</dark_gray> <#ff9ecf><disguise></#ff9ecf> <dark_gray>(<id>)</dark_gray>"
  queryall-empty: "<gray>当前没有玩家在伪装</gray>"
  lookup: "<white><player> 已解锁 <count> 个伪装：</white><list>"
  lookup-empty: "<gray><player> 还没有解锁任何伪装</gray>"
  banned: "<white>已禁用 <id></white>"
  unbanned: "<white>已解除禁用 <id></white>"
  already-banned: "<gray><id> 已经被禁用了</gray>"
  not-banned: "<gray><id> 没有被禁用</gray>"
  bans: "<white>禁用列表：</white><gray><list></gray>"
  bans-empty: "<gray>禁用列表为空</gray>"
